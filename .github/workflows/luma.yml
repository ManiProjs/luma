name: Luma CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22.23.5
  BUN_VERSION: 1.4.4

jobs:
  validate:
    name: Validate source and clients
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Core tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes git ripgrep shellcheck

      - name: Install Dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      - name: Install Desktop dependencies
        run: npm ci --prefix desktop --no-audit --no-fund

      - name: Install Ink dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Check and bundle Ink client
        working-directory: ui
        run: |
          bun run typecheck
          bun run build

      - name: Check and build Dashboard
        working-directory: dashboard
        run: |
          npm run typecheck
          npm run build

      - name: Check Desktop
        working-directory: desktop
        run: |
          npm run typecheck
          npm run lint

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate installer scripts
        run: |
          bash -n scripts/install.sh scripts/test-install.sh
          shellcheck scripts/install.sh scripts/test-install.sh
          python -m py_compile scripts/package-bundle.py
          bash scripts/test-install.sh

  build-bundles:
    name: Build ${{ matrix.target }} bundle
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install and build Dashboard assets
        run: |
          npm ci --prefix dashboard --no-audit --no-fund
          npm run build --prefix dashboard

      - name: Install and bundle Ink client
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Luma Core
        run: cargo build --locked --release --no-default-features --target ${{ matrix.target }}

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/install.ps1 -Raw)) | Out-Null

      - name: Assemble and verify bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          CORE="target/${TARGET}/release/luma-core"
          if [[ "$TARGET" == *windows-msvc ]]; then CORE="${CORE}.exe"; fi
          mkdir -p dist
          python scripts/package-bundle.py \
            --target "$TARGET" \
            --core "$CORE" \
            --cli ui/dist/luma-cli.js \
            --version "$VERSION" \
            --output "dist/luma-${TARGET}.tar.gz"
          tar -tzf "dist/luma-${TARGET}.tar.gz" | sort
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in Path("dist").glob("luma-*.tar.gz"):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              path.with_suffix(path.suffix + ".sha256").write_text(f"{digest}  {path.name}\n")
          PY

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: luma-${{ matrix.target }}
          path: dist/luma-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build-bundles]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: luma-*
          path: release-assets
          merge-multiple: true

      - name: Add installer entrypoints and aggregate checksums
        run: |
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          cd release-assets
          sha256sum luma-*.tar.gz install.sh install.ps1 > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then PRERELEASE=(--prerelease); else PRERELEASE=(); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Luma $TAG" \
              --generate-notes \
              "${PRERELEASE[@]}"
          fi
