[package]
# The Rust side is the core, and it is no longer the `luma` command: that name
# belongs to the Ink client, which is what people will actually type. This
# binary is the stdio JSONL server that client drives.
name = "luma-core"
version = "0.1.0"
edition = "2024"
description = "The Luma core: a lightweight AI coding agent engine optimized for local models and low-memory environments"
authors = ["Mani Arasteh"]
license = "MIT"
repository = "https://github.com/ManiProjs/luma"
readme = "README.md"
keywords = ["ai", "coding-agent", "llm", "developer-tools", "rust"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.wix]
upgrade-guid = "64608215-1097-4F96-B056-9D6A31F62AED"
path-guid = "2F6C7A45-FDA5-4DB6-85A8-47FA2EB747FA"
license = false
eula = false

[features]
# The Ratatui terminal front end. It is being replaced by an Ink client that
# speaks `src/protocol.rs` over JSONL, so the core is being made buildable
# without it. Turn this off to compile the core and the protocol server alone.
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:pulldown-cmark",
    "dep:unicode-width",
    "dep:console",
    "dep:indicatif",
    "dep:colored",
    "dep:rand",
]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
futures-util = { version = "0.3.34", features = ["sink"] }
ignore = "0.4.33"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1.4"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# The Ratatui front end and its dependencies. Nothing in the core refers to
# any of these; they are listed here only so `cargo build` can be run without
# the `tui` feature.
colored = { version = "3.1.1", optional = true }
console = { version = "0.16.4", optional = true }
crossterm = { version = "0.29.0", optional = true }
indicatif = { version = "0.18.6", optional = true }
pulldown-cmark = { version = "0.13.4", optional = true }
rand = { version = "0.10.2", optional = true }
ratatui = { version = "0.30.2", optional = true }
unicode-width = { version = "0.2.2", optional = true }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
