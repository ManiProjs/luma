[package]
name = "luma"
version = "0.1.0"
edition = "2024"
description = "A lightweight AI coding agent optimized for local models and low-memory environments"
license = "MIT"
repository = "https://github.com/ManiProjs/luma"
readme = "README.md"
keywords = ["ai", "coding-agent", "llm", "developer-tools", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
console = "0.16.4"
crossterm = "0.29.0"
dialoguer = "0.12.0"
dirs = "6.0.0"
futures-util = "0.3.34"
indicatif = "0.18.6"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1.4"
unicode-width = "0.2.2"
